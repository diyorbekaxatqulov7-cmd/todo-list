<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - Modern To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>TaskFlow</h1>
      <p>Modern Task Manager</p>
    </header>

    <main>
      <section class="add-task">
        <input type="text" id="taskInput" placeholder="What needs to be done?" autocomplete="off">
        <button id="addBtn" aria-label="Add task">+ Add Task</button>
      </section>

      <section class="task-list" id="taskList">
        <!-- Tasks will be inserted here -->
      </section>

      <section class="empty-state" id="emptyState">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color: #64748b;">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="15" y1="9" x2="9" y2="15"></line>
          <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
        <h3>No tasks yet</h3>
        <p>Add your first task to get started</p>
      </section>
    </main>

    <footer>
      <div class="stats">
        <span class="task-count">0 tasks</span>
        <span class="completed-count">0 completed</span>
      </div>
      <progress id="progressBar" max="100" value="0">0%</progress>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
